<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SmartPeak — Eendraadschema</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../assets/css/smartpeak.css?v=4">
  <link rel="stylesheet" href="../assets/css/electrical-schema.css?v=1">
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" integrity="sha384-+65NgAKqXr1Nb7sBmV6O09pL8ASqZsi29OE718meKinGAWaa70VE5V6LNjXVBjIA" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" integrity="sha384-YHSscHG455M7b+d6r5ibTMznxrZxV272bMjXT9ndTgmx05fLR7HsdmcVklhpBSyt" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="../assets/js/firebase-init.js?v=4"></script>
</head>
<body class="schema-page">
  <section id="stateLoggedOut" class="schema-access hide">
    <div class="card shadow-sm"><div class="card-body text-center p-4">
      <h1 class="h4"><i class="fa-solid fa-bolt text-primary"></i> Eendraadschema</h1>
      <p class="text-muted">Log in om tekeningen te maken en bewaren.</p>
      <button id="btnSignIn" class="btn btn-primary btn-lg">Log in met Google</button>
      <p id="signInError" class="alert alert-danger mt-3 hide"></p>
    </div></div>
  </section>

  <section id="stateNotWhitelisted" class="schema-access hide">
    <div class="card shadow-sm"><div class="card-body text-center p-4">
      <h1 class="h4">Geen toegang</h1>
      <p class="text-muted">Dit account heeft geen toegang.</p>
      <button id="btnSignOutNW" class="btn btn-outline-secondary">Uitloggen</button>
    </div></div>
  </section>

  <div id="stateAuthorized" class="hide">
    <header class="schema-toolbar">
      <a class="schema-back" href="../dashboard.html" aria-label="Terug naar projecten"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="schema-title-wrap">
        <input id="drawingTitle" class="schema-title" value="Eendraadschema" aria-label="Naam tekening">
        <div id="drawingContext" class="schema-context">Nieuwe tekening</div>
      </div>
      <div class="schema-toolbar-actions">
        <button id="btnPdf" class="btn btn-outline-primary schema-pdf"><i class="fa-solid fa-file-pdf me-1"></i> PDF</button>
        <button id="btnSave" class="btn btn-primary schema-save"><i class="fa-solid fa-floppy-disk me-1"></i> Bewaar</button>
      </div>
    </header>

    <main class="schema-main">
      <div id="projectDrawings" class="schema-project-drawings hide"></div>
      <div id="schemaStatus" class="schema-status" aria-live="polite">Nog niet bewaard</div>
      <div id="mainBreaker"></div>
      <div id="schemaCanvas" class="schema-canvas"></div>

    </main>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="addModalTitle">Wat wil je toevoegen?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button></div>
      <div class="modal-body"><div class="schema-add-grid">
        <button class="schema-choice" data-add-type="circuit"><i class="fa-solid fa-plug"></i><span>Gewone kring</span></button>
        <button class="schema-choice" data-add-type="battery"><i class="fa-solid fa-battery-full"></i><span>Batterij</span></button>
        <button class="schema-choice" data-add-type="inverter"><i class="fa-solid fa-solar-panel"></i><span>Omvormer</span></button>
        <button class="schema-choice" data-add-type="hybrid-inverter"><i class="fa-solid fa-arrows-rotate"></i><span>Hybride omvormer</span></button>
        <button class="schema-choice" data-add-type="rem-breaker"><strong>REM</strong><span>REM-automaatkring</span></button>
        <button class="schema-choice schema-choice-wide" data-add-type="differential"><strong>Δ</strong><span>Onderliggend differentieel</span></button>
      </div></div>
    </div></div>
  </div>

  <div class="modal fade" id="elementModal" tabindex="-1" aria-labelledby="elementModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <form id="elementForm">
          <div class="modal-header">
            <h2 class="modal-title h5" id="elementModalTitle">Bewerken</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button>
          </div>
          <div class="modal-body" id="elementFields"></div>
          <div class="modal-footer justify-content-between">
            <button type="button" id="btnDeleteElement" class="btn btn-outline-danger"><i class="fa-solid fa-trash"></i> Verwijder</button>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuleer</button>
              <button type="submit" class="btn btn-primary">Opslaan</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="../assets/js/pages/electrical-schema-app.js?v=1"></script>
</body>
</html>

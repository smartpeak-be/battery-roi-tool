<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/smartpeak.css?v=2" />
  <title>SmartPeak — Projecten</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" integrity="sha384-+65NgAKqXr1Nb7sBmV6O09pL8ASqZsi29OE718meKinGAWaa70VE5V6LNjXVBjIA" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" integrity="sha384-YHSscHG455M7b+d6r5ibTMznxrZxV272bMjXT9ndTgmx05fLR7HsdmcVklhpBSyt" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js" integrity="sha384-XgUhjZUY/4vSJ8bUS7DFmLGK73fbJgS+nlrQDEC5X3QBpGgO+597wN8Syegw3ONj" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"
          integrity="sha512-VjmsArkf8Vv2yyvbXCyVxp+R3n4N2WyS1GEQ+YQxa7Hu0tx836WpY4nW9/T1W5JBmvuIsxkVH/DlHgp7NEMjDw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="assets/js/shared-helpers.js"></script>
  <script type="module" src="assets/js/csv.js"></script>
  <script src="assets/js/firebase-init.js"></script>
  <script src="assets/js/status-chip.js"></script>
  <script src="assets/js/offertes-ui.js"></script>
  <script type="module" src="assets/js/photo-uploader.js"></script>
</head>
<body class="sp-dashboard-page">

<!-- State 1: not logged in -->
<div class="card mx-auto mt-5 hide" id="stateLoggedOut" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-bolt text-primary"></i> SmartPeak — Projecten</h1>
    <p class="text-muted mb-3">Alleen voor Bloxit medewerkers.</p>
    <button type="button" class="btn btn-primary" id="btnSignIn">Log in met Google</button>
    <p id="signInError" class="alert alert-danger mt-3 hide"></p>
  </div>
</div>

<!-- State 2: logged in but not whitelisted -->
<div class="card mx-auto mt-5 hide" id="stateNotWhitelisted" style="max-width:480px">
  <div class="card-body text-center p-4">
    <h1 class="h4 mb-2"><i class="fa-solid fa-triangle-exclamation icon-danger"></i> Geen toegang</h1>
    <p class="text-muted mb-3">Je bent ingelogd als <strong id="notWhitelistedEmail">…</strong> maar dit account heeft geen toegang tot SmartPeak Projecten.</p>
    <button type="button" class="btn btn-outline-secondary" id="btnSignOutNW">Uitloggen</button>
  </div>
</div>

<!-- State 3: logged in + whitelisted -->
<div class="hide" id="stateAuthorized">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-bolt text-primary"></i> SmartPeak — Projecten</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
          <li class="nav-item">
            <a class="btn btn-outline-primary btn-sm" href="producten-beheer.html">
              <i class="fa-solid fa-boxes-stacked me-1"></i> Producten
            </a>
          </li>
          <li class="nav-item">Hallo, <strong id="userDisplayName">…</strong></li>
          <li class="nav-item">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSignOut">Uitloggen</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">

    <!-- Toolbar -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-auto">
            <button type="button" class="btn btn-primary w-100 w-md-auto" id="btnNewProject">
              <i class="fa-solid fa-plus me-1"></i> Nieuw project
            </button>
          </div>
          <div class="col-12 col-md">
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
              <label for="projectSearch" class="visually-hidden">Zoek projectnaam of klant</label>
              <input type="search" id="projectSearch" class="form-control" placeholder="Zoek projectnaam of klant…" />
            </div>
          </div>
          <div class="col-6 col-md-auto">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="toggleShowFinished">
              <label class="form-check-label" for="toggleShowFinished">Toon afgesloten</label>
            </div>
          </div>
          <div class="col-6 col-md-auto">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="toggleShowDeleted">
              <label class="form-check-label" for="toggleShowDeleted">Toon verwijderde</label>
            </div>
          </div>
          <div class="col-12 col-lg-auto d-none d-lg-block">
            <div class="btn-group" role="group" id="viewToggle" aria-label="View toggle">
              <button type="button" class="btn btn-outline-primary active" data-view="list">
                <i class="fa-solid fa-list"></i> Lijst
              </button>
              <button type="button" class="btn btn-outline-primary" data-view="board">
                <i class="fa-solid fa-table-columns"></i> Bord
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Project list / kanban -->
    <div class="card">
      <div class="card-body p-0 p-md-3" id="projectList">
        <p class="sp-empty-state">⏳ Laden…</p>
      </div>
    </div>

    <!-- Leads -->
    <div class="card mt-3" id="leadsCard" style="display:none;">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span>
          <i class="fa-solid fa-user-plus me-1" aria-hidden="true"></i> Leads
          <span class="badge bg-primary ms-1" id="leadsCount">0</span>
        </span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="toggleShowDeletedLeads">
          <label class="form-check-label small" for="toggleShowDeletedLeads">Toon verwijderde</label>
        </div>
      </div>
      <div class="card-body p-0 p-md-3" id="leadsList"></div>
    </div>
  </main>
</div>

<!-- Right-side drawer (opens on project-name click) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="drawer" aria-labelledby="drawerHeaderTitle">
  <div class="offcanvas-header border-bottom" id="drawerHeader"></div>
  <div class="offcanvas-body" id="drawerBody"></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index:1090"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="module" src="assets/js/pages/dashboard-app.js?v=1"></script>

</body>
</html>
